[project]
name = "ddpg"
version = "0.1.0"
description = "Deep Deterministic Policy Gradient for continuous control, in the CleanRL single-file style: a deterministic tanh actor, a Q(s, a) critic, Gaussian exploration noise, a replay buffer, and Polyak-averaged target networks, with greedy evaluation of a saved checkpoint, a Hugging Face Hub upload path, and --hf-job for Hugging Face Jobs."
authors = [
    {name = "Byamasu Patrick Paul",email = "43136469+byamasu-patrick@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Pinned to match requirements.txt
    "gymnasium[mujoco]==1.3.0",
    "mujoco==4.0.0",
    "torch==2.13.0",
    "numpy==2.5.2",
    "tensorboard==2.21.0",
    "wandb==0.28.2",
    "moviepy==2.2.1",
    # renders the classic-control tasks (Pendulum, MountainCarContinuous) for --capture-video and evaluation
    "pygame==2.6.1",
    # Launcher behind --hf-job; algorithm.py imports it unconditionally.
    "hf-jobs-launch==0.2.0",
]

[project.optional-dependencies]
# Needed only by the --upload-model path in hugging_face.py.
hub = [
    "huggingface-hub==2.4.0",
    "tenacity==9.2.1",
]

[tool.poetry]
# This project is a script, not a distributable package: `algorithm.py` is run
# directly and there is no importable top-level package to build. With
# package-mode disabled, `poetry install` resolves dependencies only.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.hf-jobs]
# Defaults for `--hf-job` (hf-jobs-launch); any of them can be overridden with the matching --hf-* flag.
namespace = "baobabtech"
flavor = "t4-small"
timeout = "24h"
image = "python:3.12"
