[project]
name = "ppo"
version = "0.1.0"
description = "A from-scratch re-implementation of Proximal Policy Optimization (PPO), a policy-gradient reinforcement learning algorithm, designed to reproduce and study the core PPO algorithm through a clean, modular, and experimentally reproducible implementation. The project covers policy and value networks, clipped surrogate objectives, generalized advantage estimation (GAE), trajectory collection, minibatch updates, and PPO training dynamics."
authors = [
    {name = "Byamasu Patrick Paul",email = "43136469+byamasu-patrick@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "gymnasium==1.3.0",
    "torch==2.13.0",
    "stable-baselines3==2.9.0",
    "tensorboard==2.21.0",
    "wandb==0.28.2",
    "pygame==2.6.1",
    "moviepy==2.2.1"
]

[tool.poetry]
package-mode = true
packages = [
    {include = "ppo", from = "src"}
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
