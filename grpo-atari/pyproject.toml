[project]
name = "grpo-atari"
version = "0.1.0"
description = "DQN, PPO and GRPO (critic-free PPO) on Atari with shared preprocessing, logging and evaluation, runnable one at a time or as parallel sweeps, locally or on Hugging Face Jobs."
authors = [
    {name = "Byamasu Patrick Paul",email = "43136469+byamasu-patrick@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
# ale-py 0.8.1 (the release that registers Atari envs with gymnasium 0.29) has wheels up to Python 3.11.
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch==2.13.0",
    # gymnasium 0.29's passive env checker still uses np.bool8, which numpy 2 removed.
    "numpy==1.26.4",
    "gymnasium[atari,accept-rom-license]==0.29.1",
    "ale-py==0.8.1",
    # Atari wrappers (NoopReset, MaxAndSkip, EpisodicLife, FireReset, ClipReward).
    "stable-baselines3==2.3.2",
    # Headless build: the regular one needs libGL, which the Linux Job image lacks.
    "opencv-python-headless==4.10.0.84",
    # gymnasium 0.29's RecordVideo is written against the moviepy 1.x API.
    "moviepy==1.0.3",
    "pygame==2.6.1",
    "tensorboard==2.21.0",
    "wandb==0.28.2",
    # config.yaml written into each run directory.
    "PyYAML==6.0.3",
    "tqdm==4.70.0",
    "setuptools==84.0.0",
    # Launcher behind --hf-job; algorithm.py imports it unconditionally. Pinned to a release tag;
    # switch to "hf-jobs-launch==0.1.0" once it is on PyPI.
    "hf-jobs-launch @ git+https://github.com/byamasu-patrick/rl-algorithms-lab.git@hf-jobs-launch-v0.1.0#subdirectory=hf-training-jobs",
]

[project.optional-dependencies]
# Needed only by the --upload-model path.
hub = [
    "huggingface-hub==1.28.0",
    "tenacity==9.1.2",
]

[tool.poetry]
# This project is a script, not a distributable package: `algorithm.py` is run
# directly and there is no importable top-level package to build. With
# package-mode disabled, `poetry install` resolves dependencies only.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.hf-jobs]
# Defaults for `--hf-job` (hf-jobs-launch); any of them can be overridden with the matching --hf-* flag.
namespace = "baobabtech"
flavor = "t4-small"
timeout = "24h"
# ale-py 0.8.1, which this project pins, has no wheels past Python 3.11.
image = "python:3.11"
