[project]
name = "ppo-continuous-actions"
version = "0.1.0"
description = "PPO for continuous control on the PyBullet robotics environments. Replaces the categorical policy with a diagonal Gaussian over a real-valued action vector, using a state-independent learned log-std, plus running observation and reward normalization."
authors = [
    {name = "Byamasu Patrick Paul",email = "43136469+byamasu-patrick@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Pinned to match requirements.txt
    "gymnasium==1.3.0",
    "numpy==2.5.2",
    "pybullet==3.2.7",
    "pybullet-envs-gymnasium==0.6.0",
    # Imported by algorithm.py but absent from requirements.txt, which was frozen
    # from an environment without them. Pinned to the versions the sibling PPO
    # projects use, so a Poetry install produces a runnable environment.
    "torch==2.13.0",
    "tensorboard==2.21.0",
    "wandb==0.28.2",
    "moviepy==2.2.1",
    "pygame==2.6.1",
]

[tool.poetry]
# This project is a script, not a distributable package: `algorithm.py` is run
# directly and there is no importable top-level package to build. With
# package-mode disabled, `poetry install` resolves dependencies only.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
