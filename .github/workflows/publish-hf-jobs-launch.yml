# Builds, tests and publishes hf-training-jobs (the hf-jobs-launch package) to PyPI.
#
# Release: bump `version` in hf-training-jobs/pyproject.toml and `__version__` in hf_jobs/__init__.py,
# commit, then push a matching tag:
#   git tag hf-jobs-launch-v0.3.0 && git push origin hf-jobs-launch-v0.3.0
#
# Publishing uses PyPI Trusted Publishing (OIDC), so no API token is stored in this repository. The
# PyPI publisher must name this repository, this workflow file and the `pypi` environment.

name: Publish hf-jobs-launch

on:
  push:
    tags: ["hf-jobs-launch-v*"]
  # manual run from the Actions tab, e.g. to publish a version whose tag predates this workflow
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hf-training-jobs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "hf-jobs-launch-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest -q

      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: hf-training-jobs/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hf-jobs-launch/
    permissions:
      id-token: write  # lets the job prove its identity to PyPI; nothing else is granted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
