[project]
name = "ppo-atari"
version = "0.1.0"
description = "PPO scaled to the Arcade Learning Environment: a Nature-DQN convolutional policy over stacked grayscale frames, with the standard Atari preprocessing pipeline and the evaluation protocol recommended by Machado et al. (2017)."
authors = [
    {name = "Byamasu Patrick Paul",email = "43136469+byamasu-patrick@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "gymnasium==1.3.0",
    "torch==2.13.0",
    "numpy==2.5.2",
    "ale-py==0.12.1",
    "stable-baselines3==2.9.0",
    "opencv-python==5.0.0.93",
    "tensorboard==2.21.0",
    "wandb==0.28.2",
    "moviepy==2.2.1",
    "pygame==2.6.1",
]

[tool.poetry]
# This project is a script, not a distributable package: `algorithm.py` is run
# directly and there is no importable top-level package to build. With
# package-mode disabled, `poetry install` resolves dependencies only.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
