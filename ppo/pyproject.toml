[project]
name = "ppo"
version = "0.1.0"
description = "A from-scratch re-implementation of Proximal Policy Optimization (PPO) for classic control, built to study the algorithm one implementation detail at a time. Covers the clipped surrogate objective, generalized advantage estimation, vectorized rollout collection, and minibatch updates."
authors = [
    {name = "Byamasu Patrick Paul",email = "43136469+byamasu-patrick@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "gymnasium==1.3.0",
    "torch==2.13.0",
    "numpy==2.5.2",
    "tensorboard==2.21.0",
    "wandb==0.28.2",
    "moviepy==2.2.1",
    "pygame==2.6.1",
    "stable-baselines3==2.9.0",
]

[tool.poetry]
# This project is a script, not a distributable package: `algorithm.py` is run
# directly and there is no importable top-level package to build. With
# package-mode disabled, `poetry install` resolves dependencies only.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
