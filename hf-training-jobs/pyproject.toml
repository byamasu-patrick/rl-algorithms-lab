[project]
name = "hf-training-jobs"
version = "0.1.0"
description = "Submit a training script to Hugging Face Jobs with a single --hf-job flag."
authors = [
    {name = "Byamasu Patrick Paul",email = "43136469+byamasu-patrick@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=1.28.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hf_jobs"]
