[project]
name = "ppo-rnd"
version = "0.1.0"
description = "PPO with Random Network Distillation (Burda et al., 2018) for hard-exploration Atari, in the CleanRL single-file style: a novelty bonus from the prediction error of a trained network against a fixed random one, separate extrinsic and intrinsic value heads, and observation and reward normalisation, on Gymnasium 1.x and ale-py with --hf-job for Hugging Face Jobs."
authors = [
    {name = "Byamasu Patrick Paul",email = "43136469+byamasu-patrick@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Pinned to match requirements.txt and ppo-atari/
    "gymnasium==1.3.0",
    "ale-py==0.12.1",
    "torch==2.13.0",
    "numpy==2.5.2",
    "stable-baselines3==2.9.0",
    # headless: the full opencv-python needs libGL, which the Hugging Face Jobs images don't have
    "opencv-python-headless==5.0.0.93",
    "tensorboard==2.21.0",
    "wandb==0.28.2",
    "moviepy==2.2.1",
    # Launcher behind --hf-job; algorithm.py imports it unconditionally.
    "hf-jobs-launch==0.2.0",
]

[tool.poetry]
# This project is a script, not a distributable package: `algorithm.py` is run
# directly and there is no importable top-level package to build. With
# package-mode disabled, `poetry install` resolves dependencies only.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.hf-jobs]
# Defaults for `--hf-job` (hf-jobs-launch); any of them can be overridden with the matching --hf-* flag.
# RND runs 128 emulators in parallel, so the CPU count matters as much as the GPU: l4x1 has 8 vCPUs
# and 30 GB of RAM (a10g-large has 12 vCPUs, for more emulator throughput).
namespace = "baobabtech"
flavor = "l4x1"
timeout = "24h"
image = "python:3.12"
