[project]
name = "dqn"
version = "0.1.0"
description = "A from-scratch implementation of the Nature DQN on Atari: experience replay, a delayed target network, and epsilon-greedy exploration, with greedy evaluation of a saved checkpoint, a Hugging Face Hub upload path, and optional training on Hugging Face Jobs."
authors = [
    {name = "Byamasu Patrick Paul",email = "43136469+byamasu-patrick@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
# ale-py 0.8.1 (the release that registers Atari envs with gymnasium 0.29) has wheels up to Python 3.11.
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch==2.13.0",
    # gymnasium 0.29's passive env checker still uses np.bool8, which numpy 2 removed.
    "numpy==1.26.4",
    "gymnasium[atari,accept-rom-license]==0.29.1",
    "ale-py==0.8.1",
    "stable-baselines3==2.3.2",
    # Headless build: the regular one needs libGL, which the Linux Job image lacks.
    "opencv-python-headless==4.10.0.84",
    # gymnasium 0.29's RecordVideo is written against the moviepy 1.x API.
    "moviepy==1.0.3",
    "pygame==2.6.1",
    "tensorboard==2.21.0",
    "wandb==0.28.2",
    "setuptools==84.0.0",
]

[project.optional-dependencies]
# Needed only by the --upload-model path in hugging_face.py.
hub = [
    "huggingface-hub==1.28.0",
    "tenacity==9.1.2",
]

[tool.poetry]
# This project is a script, not a distributable package: `algorithm.py` is run
# directly and there is no importable top-level package to build. With
# package-mode disabled, `poetry install` resolves dependencies only.
package-mode = false

[tool.poetry.dependencies]
# Launcher behind --hf-job; algorithm.py imports it unconditionally.
hf-jobs-launch = {path = "../hf-training-jobs", develop = true}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.hf-jobs]
# Defaults for `--hf-job` (hf-jobs-launch); any of them can be overridden with the matching --hf-* flag.
namespace = "baobabtech"
flavor = "t4-small"
timeout = "24h"
# ale-py 0.8.1, which this project pins, has no wheels past Python 3.11.
image = "python:3.11"
